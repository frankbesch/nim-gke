<svg viewBox="0 0 360 551" xmlns="http://www.w3.org/2000/svg" role="img" font-family='ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace'>
<title>nim-gke: what it deploys</title>
<desc>A client (curl or an OpenAI SDK) calls the NIM pod over the OpenAI-compatible API. The NIM pod runs llama3-8b-instruct 1.0.0 with backend profile vllm-fp16-tp1. It pulls its image from the NGC registry and keeps model files on a 50 GiB persistent disk. It is scheduled on one GPU node, g2-standard-4 with one NVIDIA L4. With AUTOSCALE=1, the GKE cluster autoscaler adds and removes that node. The pod, disk, GPU node, and autoscaler sit inside the GKE cluster in us-central1-a.</desc>
<rect width="360" height="551" rx="6" fill="#FCFBF9"/>
<rect x="16" y="16" width="156" height="54" rx="5" fill="#EBE6DD" stroke="#6A625A" stroke-width="1.5"/>
<text x="94" y="39" font-size="12.5" fill="#2B2926" text-anchor="middle" font-weight="600">Client</text>
<text x="94" y="57" font-size="12" fill="#6A625A" text-anchor="middle">curl or OpenAI SDK</text>
<rect x="188" y="16" width="156" height="54" rx="5" fill="#EBE6DD" stroke="#6A625A" stroke-width="1.5"/>
<text x="266" y="39" font-size="12.5" fill="#2B2926" text-anchor="middle" font-weight="600">NGC registry</text>
<text x="266" y="57" font-size="12" fill="#6A625A" text-anchor="middle">nvcr.io/nim/meta</text>
<rect x="8" y="104" width="344" height="350" rx="8" fill="none" stroke="#916A0B" stroke-dasharray="7 5"/>
<path d="M94 70 L94 118" fill="none" stroke="#33703F" stroke-width="2"/><polygon points="89,110 99,110 94,118" fill="#33703F"/>
<rect x="13.4" y="84" width="161.2" height="18" rx="3" fill="#FCFBF9"/><text x="94" y="97" font-size="12" fill="#33703F" text-anchor="middle">OpenAI-compatible API</text>
<path d="M266 70 L266 118" fill="none" stroke="#6A625A" stroke-width="1.5"/><polygon points="261,110 271,110 266,118" fill="#6A625A"/>
<rect x="225.0" y="84" width="82.0" height="18" rx="3" fill="#FCFBF9"/><text x="266" y="97" font-size="12" fill="#6A625A" text-anchor="middle">image pull</text>
<rect x="24" y="118" width="312" height="70" rx="5" fill="#EBE6DD" stroke="#33703F" stroke-width="1.5"/>
<text x="180" y="141" font-size="12.5" fill="#2B2926" text-anchor="middle" font-weight="600">NIM pod</text>
<text x="180" y="159" font-size="12" fill="#6A625A" text-anchor="middle">llama3-8b-instruct 1.0.0</text>
<text x="180" y="175" font-size="12" fill="#33703F" text-anchor="middle">vllm-fp16-tp1</text>
<path d="M98 188 L98 236" fill="none" stroke="#6A625A" stroke-width="1.5"/><polygon points="93,228 103,228 98,236" fill="#6A625A"/>
<rect x="53.4" y="202" width="89.2" height="18" rx="3" fill="#FCFBF9"/><text x="98" y="215" font-size="12" fill="#6A625A" text-anchor="middle">model files</text>
<path d="M262 188 L262 236" fill="none" stroke="#6A625A" stroke-width="1.5"/><polygon points="257,228 267,228 262,236" fill="#6A625A"/>
<rect x="213.8" y="202" width="96.4" height="18" rx="3" fill="#FCFBF9"/><text x="262" y="215" font-size="12" fill="#6A625A" text-anchor="middle">scheduled on</text>
<rect x="24" y="236" width="148" height="54" rx="5" fill="#EBE6DD" stroke="#23749E" stroke-width="1.5"/>
<text x="98" y="259" font-size="12.5" fill="#2B2926" text-anchor="middle" font-weight="600">Persistent disk</text>
<text x="98" y="277" font-size="12" fill="#6A625A" text-anchor="middle">50 GiB model cache</text>
<rect x="188" y="236" width="148" height="102" rx="5" fill="#EBE6DD" stroke="#916A0B" stroke-width="1.5"/>
<text x="262" y="259" font-size="12.5" fill="#2B2926" text-anchor="middle" font-weight="600">GPU node</text>
<text x="262" y="277" font-size="12" fill="#6A625A" text-anchor="middle">g2-standard-4, one</text>
<text x="262" y="293" font-size="12" fill="#6A625A" text-anchor="middle">L4</text>
<text x="262" y="309" font-size="12" fill="#916A0B" text-anchor="middle">pool 0 to 1 with</text>
<text x="262" y="325" font-size="12" fill="#916A0B" text-anchor="middle">AUTOSCALE=1</text>
<path d="M262 386 L262 338" fill="none" stroke="#0084A9" stroke-width="1.5" stroke-dasharray="5 4"/><polygon points="257,346 267,346 262,338" fill="#0084A9"/>
<rect x="199.4" y="352" width="125.2" height="18" rx="3" fill="#FCFBF9"/><text x="262" y="365" font-size="12" fill="#0084A9" text-anchor="middle">adds and removes</text>
<rect x="188" y="386" width="148" height="54" rx="5" fill="#EBE6DD" stroke="#916A0B" stroke-width="1.5"/>
