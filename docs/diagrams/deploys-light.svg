<text x="262" y="427" font-size="12" fill="#6A625A" text-anchor="middle">managed by GKE</text>
<text x="20" y="419" font-size="12" fill="#916A0B" font-weight="600">GKE cluster,</text>
<text x="20" y="436" font-size="12" fill="#916A0B" font-weight="600">us-central1-a</text>
<text x="16" y="482" font-size="12.5" fill="#2B2926" font-weight="600">Legend</text>
<rect x="16" y="494" width="16" height="11" rx="2.5" fill="#EBE6DD" stroke="#33703F" stroke-width="1.5"/>
<text x="40" y="504" font-size="12" fill="#6A625A">Backend</text>
<rect x="188" y="494" width="16" height="11" rx="2.5" fill="#EBE6DD" stroke="#23749E" stroke-width="1.5"/>
<text x="212" y="504" font-size="12" fill="#6A625A">Database</text>
<rect x="16" y="516" width="16" height="11" rx="2.5" fill="#EBE6DD" stroke="#916A0B" stroke-width="1.5"/>
<text x="40" y="526" font-size="12" fill="#6A625A">Cloud</text>
<rect x="188" y="516" width="16" height="11" rx="2.5" fill="#EBE6DD" stroke="#6A625A" stroke-width="1.5"/>
<text x="212" y="526" font-size="12" fill="#6A625A">External</text>
</svg>
