<svg viewBox="0 0 360 670" xmlns="http://www.w3.org/2000/svg" role="img" font-family='"QuoinMono", ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace'>
<title>Request path</title>
<desc>A client request (curl or an OpenAI SDK) goes to the port forward on localhost:8000, then the ClusterIP Service my-nim-nim-llm:8000, the StatefulSet pod my-nim-nim-llm-0, the NIM container nvcr.io/nim/meta/llama3-8b-instruct:1.0.0, the inference backend (profile vllm-fp16-tp1 on the L4, chosen by NIM at startup), and the NVIDIA L4 GPU with 24 GB.</desc>
<style>@font-face{font-family:"QuoinMono";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"QuoinMono";font-weight:600;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"QuoinSans";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"QuoinSans";font-weight:600;src:url(data:font/woff2;base64,) format("woff2")}</style>
<rect width="360" height="670" rx="6" fill="#FCFBF9"/>
<text x="16" y="30" font-size="15" fill="#2B2926" font-weight="600" font-family='"QuoinSans", -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif'>Request path</text>
<line x1="16" y1="42" x2="344" y2="42" stroke="#D2CCC3"/>
<rect x="16" y="56" width="328" height="54" rx="5" fill="#EBE6DD" stroke="#6A625A" stroke-width="1.5"/>
<text x="180" y="79" font-size="12.5" fill="#2B2926" text-anchor="middle" font-weight="600">Client request</text>
<text x="180" y="97" font-size="12" fill="#6A625A" text-anchor="middle">curl or an OpenAI SDK</text>
<path d="M180 112 L180 130" fill="none" stroke="#6A625A" stroke-width="1.5"/><polygon points="175,122 185,122 180,130" fill="#6A625A"/>
<rect x="16" y="134" width="328" height="54" rx="5" fill="#EBE6DD" stroke="#6A625A" stroke-width="1.5"/>
<text x="180" y="157" font-size="12.5" fill="#2B2926" text-anchor="middle" font-weight="600">Port forward</text>
<text x="180" y="175" font-size="12" fill="#6A625A" text-anchor="middle">localhost:8000</text>
<path d="M180 190 L180 208" fill="none" stroke="#6A625A" stroke-width="1.5"/><polygon points="175,200 185,200 180,208" fill="#6A625A"/>
<rect x="16" y="212" width="328" height="54" rx="5" fill="#EBE6DD" stroke="#0084A9" stroke-width="1.5"/>
<text x="180" y="235" font-size="12.5" fill="#2B2926" text-anchor="middle" font-weight="600">ClusterIP Service</text>
<text x="180" y="253" font-size="12" fill="#6A625A" text-anchor="middle">my-nim-nim-llm:8000</text>
<path d="M180 268 L180 286" fill="none" stroke="#6A625A" stroke-width="1.5"/><polygon points="175,278 185,278 180,286" fill="#6A625A"/>
<rect x="16" y="290" width="328" height="54" rx="5" fill="#EBE6DD" stroke="#33703F" stroke-width="1.5"/>
<text x="180" y="313" font-size="12.5" fill="#2B2926" text-anchor="middle" font-weight="600">StatefulSet pod</text>
<text x="180" y="331" font-size="12" fill="#6A625A" text-anchor="middle">my-nim-nim-llm-0</text>
<path d="M180 346 L180 364" fill="none" stroke="#6A625A" stroke-width="1.5"/><polygon points="175,356 185,356 180,364" fill="#6A625A"/>
<rect x="16" y="368" width="328" height="70" rx="5" fill="#EBE6DD" stroke="#33703F" stroke-width="1.5"/>
<text x="180" y="391" font-size="12.5" fill="#2B2926" text-anchor="middle" font-weight="600">NIM container</text>
<text x="180" y="409" font-size="12" fill="#6A625A" text-anchor="middle">nvcr.io/nim/meta/</text>
<text x="180" y="425" font-size="12" fill="#2B2926" text-anchor="middle">llama3-8b-instruct:1.0.0</text>
<path d="M180 440 L180 458" fill="none" stroke="#6A625A" stroke-width="1.5"/><polygon points="175,450 185,450 180,458" fill="#6A625A"/>
<rect x="16" y="462" width="328" height="70" rx="5" fill="#EBE6DD" stroke="#33703F" stroke-width="1.5"/>
<text x="180" y="485" font-size="12.5" fill="#2B2926" text-anchor="middle" font-weight="600">Inference backend</text>
<text x="180" y="503" font-size="12" fill="#6A625A" text-anchor="middle">vllm-fp16-tp1 on the L4,</text>
<text x="180" y="519" font-size="12" fill="#2B2926" text-anchor="middle">chosen by NIM at startup</text>
<path d="M180 534 L180 552" fill="none" stroke="#6A625A" stroke-width="1.5"/><polygon points="175,544 185,544 180,552" fill="#6A625A"/>
<rect x="16" y="556" width="328" height="54" rx="5" fill="#EBE6DD" stroke="#916A0B" stroke-width="1.5"/>
<text x="180" y="579" font-size="12.5" fill="#2B2926" text-anchor="middle" font-weight="600">NVIDIA L4 GPU</text>
<text x="180" y="597" font-size="12" fill="#6A625A" text-anchor="middle">24 GB, Tensor Cores</text>
<text x="16" y="636" font-size="12" fill="#6A625A" font-family='"QuoinSans", -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif'>Port forward is the development path; the kit opens no</text>
<text x="16" y="653" font-size="12" fill="#6A625A" font-family='"QuoinSans", -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif'>public endpoint.</text>
</svg>
