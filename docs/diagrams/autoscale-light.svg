<svg viewBox="0 0 360 679" xmlns="http://www.w3.org/2000/svg" role="img" font-family='"QuoinMono", ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace'>
<title>GPU node autoscaling, 0 to 1 to 0</title>
<desc>The GPU node pool starts at 0 nodes. The NIM pod goes Pending and asks for one GPU. The GPU node is Ready 1 m 17 s later. NIM serves the benchmark, then replicas are set to 0. The pool is back at 0 nodes 12 m 32 s after that.</desc>
<style>@font-face{font-family:"QuoinMono";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"QuoinMono";font-weight:600;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"QuoinSans";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"QuoinSans";font-weight:600;src:url(data:font/woff2;base64,) format("woff2")}</style>
<rect width="360" height="679" rx="6" fill="#FCFBF9"/>
<text x="16" y="30" font-size="15" fill="#2B2926" font-weight="600" font-family='"QuoinSans", -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif'>GPU node autoscaling, 0 to 1 to 0</text>
<line x1="16" y1="42" x2="344" y2="42" stroke="#D2CCC3"/>
<rect x="16" y="54" width="328" height="57" rx="4" fill="#EBE6DD" stroke="#33703F"/>
<text x="30" y="78.5" font-size="13" fill="#2B2926" font-weight="600">Pool at 0 nodes</text>
<text x="30" y="96.5" font-size="12" fill="#6A625A">cluster up, no GPU</text>
<path d="M40 115 L40 178" fill="none" stroke="#6A625A" stroke-width="1.5"/><polygon points="35,170 45,170 40,178" fill="#6A625A"/>
<rect x="16" y="182" width="328" height="57" rx="4" fill="#EBE6DD" stroke="#6A625A"/>
<text x="30" y="206.5" font-size="13" fill="#2B2926" font-weight="600">NIM pod Pending</text>
<text x="30" y="224.5" font-size="12" fill="#6A625A">asks for one GPU</text>
<path d="M40 243 L40 306" fill="none" stroke="#33703F" stroke-width="2"/><polygon points="35,298 45,298 40,306" fill="#33703F"/>
<text x="58" y="279.5" font-size="13" fill="#2B2926" font-weight="600">scale-up: 1 m 17 s</text>
<rect x="16" y="310" width="328" height="57" rx="4" fill="#EBE6DD" stroke="#6A625A"/>
<text x="30" y="334.5" font-size="13" fill="#2B2926" font-weight="600">GPU node Ready</text>
<text x="30" y="352.5" font-size="12" fill="#6A625A">autoscaler added it</text>
<path d="M40 371 L40 434" fill="none" stroke="#6A625A" stroke-width="1.5"/><polygon points="35,426 45,426 40,434" fill="#6A625A"/>
<rect x="16" y="438" width="328" height="57" rx="4" fill="#EBE6DD" stroke="#6A625A"/>
<text x="30" y="462.5" font-size="13" fill="#2B2926" font-weight="600">NIM serving</text>
<text x="30" y="480.5" font-size="12" fill="#6A625A">benchmark, then replicas 0</text>
<path d="M40 499 L40 562" fill="none" stroke="#0084A9" stroke-width="2"/><polygon points="35,554 45,554 40,562" fill="#0084A9"/>
<text x="58" y="535.5" font-size="13" fill="#2B2926" font-weight="600">scale-down: 12 m 32 s</text>
<rect x="16" y="566" width="328" height="57" rx="4" fill="#EBE6DD" stroke="#33703F"/>
<text x="30" y="590.5" font-size="13" fill="#2B2926" font-weight="600">Pool back at 0</text>
<text x="30" y="608.5" font-size="12" fill="#6A625A">autoscaler removed it</text>
<text x="16" y="645" font-size="12" fill="#6A625A" font-family='"QuoinSans", -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif'>Run 3, 2026-09-28, one NVIDIA L4. Measured once.</text>
<text x="16" y="662" font-size="12" fill="#6A625A" font-family='"QuoinSans", -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif'>Scale-down used GKE&#x27;s default delay.</text>
</svg>
