<svg viewBox="0 0 360 551" xmlns="http://www.w3.org/2000/svg" role="img" font-family='ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace'>
<title>Posted Google Cloud cost by billing line</title>
<desc>Posted list cost $1.19 for five starts: L4 GPU $0.5608, G2 host VM $0.1471, E2 system node $0.1887, persistent disk $0.0440, Kubernetes Engine fee $0.19 credited, networking $0.05 credited, Cloud Monitoring $0.01. Charged after credits $0.95.</desc>
<rect width="360" height="551" rx="6" fill="#0E1C2B"/>
<text x="16" y="30" font-size="15" fill="#E8E2D6" font-weight="600">Posted Google Cloud cost by billing</text>
<text x="16" y="50" font-size="15" fill="#E8E2D6" font-weight="600">line</text>
<line x1="16" y1="62" x2="344" y2="62" stroke="#2D4152"/>
<text x="16" y="86" font-size="12" fill="#E8E2D6">All five starts, 2026-09-27 and 2026-09-28</text>
<rect x="16.0" y="97" width="153.1" height="48" rx="1" fill="#6DA361"/>
<rect x="170.6" y="97" width="39.0" height="48" rx="1" fill="#17A1C8"/>
<rect x="211.1" y="97" width="50.5" height="48" rx="1" fill="#9C7300"/>
<rect x="263.1" y="97" width="10.6" height="48" rx="1" fill="#559ACA"/>
<rect x="275.3" y="97" width="50.9" height="48" rx="1" fill="#A8A296"/>
<rect x="327.6" y="97" width="12.3" height="48" rx="1" fill="#A8A296"/>
<rect x="341.4" y="97" width="1.3" height="48" rx="1" fill="#A8A296"/>
<text x="344" y="165" font-size="13" fill="#E8E2D6" text-anchor="end" font-weight="600">$1.19 list</text>
<line x1="16" y1="194" x2="344" y2="194" stroke="#2D4152"/>
<text x="344" y="216" font-size="12" fill="#A8A296" text-anchor="end">List cost</text>
<rect x="16.0" y="230" width="11.0" height="11" rx="2" fill="#6DA361"/>
<text x="34" y="240" font-size="12" fill="#E8E2D6">GPU, NVIDIA L4</text>
<text x="344" y="240" font-size="12" fill="#E8E2D6" text-anchor="end">$0.5608</text>
<rect x="16.0" y="263" width="11.0" height="11" rx="2" fill="#17A1C8"/>
<text x="34" y="273" font-size="12" fill="#E8E2D6">GPU host VM, G2 cores and memory</text>
<text x="344" y="273" font-size="12" fill="#E8E2D6" text-anchor="end">$0.1471</text>
<rect x="16.0" y="296" width="11.0" height="11" rx="2" fill="#9C7300"/>
<text x="34" y="306" font-size="12" fill="#E8E2D6">System node, E2 cores and memory</text>
<text x="344" y="306" font-size="12" fill="#E8E2D6" text-anchor="end">$0.1887</text>
<rect x="16.0" y="329" width="11.0" height="11" rx="2" fill="#559ACA"/>
<text x="34" y="339" font-size="12" fill="#E8E2D6">Balanced persistent disk</text>
<text x="344" y="339" font-size="12" fill="#E8E2D6" text-anchor="end">$0.0440</text>
<rect x="16.0" y="362" width="11.0" height="11" rx="2" fill="#A8A296"/>
<text x="34" y="372" font-size="12" fill="#E8E2D6">Kubernetes Engine fee, credited</text>
<text x="344" y="372" font-size="12" fill="#E8E2D6" text-anchor="end">$0.19</text>
<rect x="16.0" y="395" width="11.0" height="11" rx="2" fill="#A8A296"/>
<text x="34" y="405" font-size="12" fill="#E8E2D6">Networking, credited</text>
<text x="344" y="405" font-size="12" fill="#E8E2D6" text-anchor="end">$0.05</text>
<rect x="16.0" y="428" width="11.0" height="11" rx="2" fill="#A8A296"/>
<text x="34" y="438" font-size="12" fill="#E8E2D6">Cloud Monitoring</text>
<text x="344" y="438" font-size="12" fill="#E8E2D6" text-anchor="end">$0.01</text>
<text x="16" y="479" font-size="12" fill="#A8A296">Charged after credits: $0.95. Posted usage</text>
<text x="16" y="496" font-size="12" fill="#A8A296">from the Cloud Billing report, read on</text>
<text x="16" y="513" font-size="12" fill="#A8A296">2026-10-02. Not an invoice.</text>
<text x="16" y="534" font-size="12" fill="#A8A296">The report splits by day, not by run.</text>
