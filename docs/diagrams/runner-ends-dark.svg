<svg viewBox="0 0 360 679" xmlns="http://www.w3.org/2000/svg" role="img" font-family='ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace'>
<title>How the runner ends</title>
<desc>The runner sets a trap and arms a watchdog in its own session. The steps run: deploy and benchmark. Cleanup runs from the trap on every exit. When cleanup is confirmed, the runner exits with the cluster deleted. If the runner dies or the time limit passes, the watchdog runs cleanup. If cleanup cannot be confirmed, the runner prints the gcloud delete commands and leaves the watchdog armed.</desc>
<rect width="360" height="679" rx="6" fill="#0E1C2B"/>
<rect x="8" y="12" width="164" height="502" rx="8" fill="none" stroke="#9C7300" stroke-dasharray="7 5"/>
<rect x="188" y="12" width="164" height="392" rx="8" fill="none" stroke="#9C7300" stroke-dasharray="7 5"/>
<text x="18" y="31" font-size="12" fill="#9C7300" font-weight="600">Runner</text>
<text x="194" y="31" font-size="12" fill="#9C7300" font-weight="600">Watchdog, own session</text>
<path d="M164 69 L196 69" fill="none" stroke="#A8A296" stroke-width="1.5"/><polygon points="188,64 188,74 196,69" fill="#A8A296"/>
<path d="M236 96 L236 113 L90 113 L90 130" fill="none" stroke="#A8A296" stroke-width="1.5"/><polygon points="85,122 95,122 90,130" fill="#A8A296"/>
<path d="M90 200 L90 234" fill="none" stroke="#A8A296" stroke-width="1.5"/><polygon points="85,226 95,226 90,234" fill="#A8A296"/>
<path d="M90 288 L90 322" fill="none" stroke="#A8A296" stroke-width="1.5"/><polygon points="85,314 95,314 90,322" fill="#A8A296"/>
<path d="M300 96 L300 322" fill="none" stroke="#17A1C8" stroke-width="1.5" stroke-dasharray="5 4"/><polygon points="295,314 305,314 300,322" fill="#17A1C8"/>
<rect x="259.0" y="213" width="82.0" height="18" rx="3" fill="#0E1C2B"/><text x="300" y="226" font-size="12" fill="#17A1C8" text-anchor="middle">takes over</text>
<path d="M196 349 L164 349" fill="none" stroke="#A8A296" stroke-width="1.5"/><polygon points="172,344 172,354 164,349" fill="#A8A296"/>
<path d="M60 392 L60 448" fill="none" stroke="#6DA361" stroke-width="2"/><polygon points="55,440 65,440 60,448" fill="#6DA361"/>
<rect x="66.0" y="401" width="31.6" height="18" rx="3" fill="#0E1C2B"/><text x="70" y="414" font-size="12" fill="#6DA361">yes</text>
<path d="M120 392 L120 426 L270 426 L270 448" fill="none" stroke="#D17276" stroke-width="1.5" stroke-dasharray="5 4"/><polygon points="265,440 275,440 270,448" fill="#D17276"/>
<rect x="126.0" y="401" width="24.4" height="18" rx="3" fill="#0E1C2B"/><text x="130" y="414" font-size="12" fill="#D17276">no</text>
<rect x="16" y="42" width="148" height="54" rx="5" fill="#1F3142" stroke="#6DA361" stroke-width="1.5"/>
<text x="90" y="65" font-size="12.5" fill="#E8E2D6" text-anchor="middle" font-weight="600">Start runner</text>
<text x="90" y="83" font-size="12" fill="#A8A296" text-anchor="middle">trap is set</text>
<rect x="196" y="42" width="148" height="54" rx="5" fill="#1F3142" stroke="#D17276" stroke-width="1.5"/>
<text x="270" y="65" font-size="12.5" fill="#E8E2D6" text-anchor="middle" font-weight="600">Arm watchdog</text>
<text x="270" y="83" font-size="12" fill="#A8A296" text-anchor="middle">own session</text>
<rect x="16" y="130" width="148" height="70" rx="5" fill="#1F3142" stroke="#6DA361" stroke-width="1.5"/>
<text x="90" y="153" font-size="12.5" fill="#E8E2D6" text-anchor="middle" font-weight="600">Run steps</text>
<text x="90" y="171" font-size="12" fill="#A8A296" text-anchor="middle">deploy and</text>
<text x="90" y="187" font-size="12" fill="#A8A296" text-anchor="middle">benchmark</text>
<rect x="16" y="234" width="148" height="54" rx="5" fill="#1F3142" stroke="#6DA361" stroke-width="1.5"/>
<text x="90" y="257" font-size="12.5" fill="#E8E2D6" text-anchor="middle" font-weight="600">Cleanup</text>
<text x="90" y="275" font-size="12" fill="#A8A296" text-anchor="middle">trap on every exit</text>
<rect x="16" y="322" width="148" height="70" rx="5" fill="#1F3142" stroke="#D17276" stroke-width="1.5"/>
<text x="90" y="345" font-size="12.5" fill="#E8E2D6" text-anchor="middle" font-weight="600">Cleanup confirmed</text>
<text x="90" y="363" font-size="12" fill="#A8A296" text-anchor="middle">cluster and disks</text>
<text x="90" y="379" font-size="12" fill="#A8A296" text-anchor="middle">gone</text>
<rect x="196" y="322" width="148" height="70" rx="5" fill="#1F3142" stroke="#17A1C8" stroke-width="1.5"/>
<text x="270" y="345" font-size="12.5" fill="#E8E2D6" text-anchor="middle" font-weight="600">Watchdog cleanup</text>
<text x="270" y="363" font-size="12" fill="#A8A296" text-anchor="middle">runner died or</text>
<text x="270" y="379" font-size="12" fill="#A8A296" text-anchor="middle">time limit</text>
<rect x="16" y="448" width="148" height="54" rx="5" fill="#1F3142" stroke="#9C7300" stroke-width="1.5"/>
<text x="90" y="471" font-size="12.5" fill="#E8E2D6" text-anchor="middle" font-weight="600">Exit</text>
<text x="90" y="489" font-size="12" fill="#A8A296" text-anchor="middle">cluster deleted</text>
<rect x="196" y="448" width="148" height="102" rx="5" fill="#1F3142" stroke="#A8A296" stroke-width="1.5"/>
<text x="270" y="471" font-size="12.5" fill="#E8E2D6" text-anchor="middle" font-weight="600">Manual delete</text>
<text x="270" y="489" font-size="12" fill="#A8A296" text-anchor="middle">prints gcloud</text>
<text x="270" y="505" font-size="12" fill="#A8A296" text-anchor="middle">commands</text>
<text x="270" y="521" font-size="12" fill="#A8A296" text-anchor="middle">watchdog stays</text>
<text x="270" y="537" font-size="12" fill="#A8A296" text-anchor="middle">armed</text>
<text x="16" y="590" font-size="12.5" fill="#E8E2D6" font-weight="600">Legend</text>
<rect x="16" y="602" width="16" height="11" rx="2.5" fill="#1F3142" stroke="#6DA361" stroke-width="1.5"/>
<text x="40" y="612" font-size="12" fill="#A8A296">Runner step</text>
<rect x="188" y="602" width="16" height="11" rx="2.5" fill="#1F3142" stroke="#D17276" stroke-width="1.5"/>
<text x="212" y="612" font-size="12" fill="#A8A296">Check</text>
<rect x="16" y="624" width="16" height="11" rx="2.5" fill="#1F3142" stroke="#17A1C8" stroke-width="1.5"/>
<text x="40" y="634" font-size="12" fill="#A8A296">Watchdog action</text>
<rect x="188" y="624" width="16" height="11" rx="2.5" fill="#1F3142" stroke="#9C7300" stroke-width="1.5"/>
<text x="212" y="634" font-size="12" fill="#A8A296">Clean exit</text>
<rect x="16" y="646" width="16" height="11" rx="2.5" fill="#1F3142" stroke="#A8A296" stroke-width="1.5"/>
<text x="40" y="656" font-size="12" fill="#A8A296">Manual follow-up</text>
</svg>
