<svg viewBox="0 0 360 670" xmlns="http://www.w3.org/2000/svg" role="img" font-family='"QuoinMono", ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace'>
<title>Port forward tunnel</title>
<desc>The port forward tunnels localhost:8000 on your machine through kubectl port-forward service/my-nim-nim-llm 8000:8000, the Kubernetes API server, and the GPU node (g2-standard-4, one L4) to port 8000 on the NIM pod. Inside the cluster, the Service (ClusterIP 34.118.X.X, DNS my-nim-nim-llm.nim.svc.cluster.local) forwards through kube-proxy iptables rules to the pod IP.</desc>
<style>@font-face{font-family:"QuoinMono";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"QuoinMono";font-weight:600;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"QuoinSans";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"QuoinSans";font-weight:600;src:url(data:font/woff2;base64,) format("woff2")}</style>
<rect width="360" height="670" rx="6" fill="#0E1C2B"/>
<text x="16" y="30" font-size="15" fill="#E8E2D6" font-weight="600" font-family='"QuoinSans", -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif'>Port forward tunnel</text>
<line x1="16" y1="42" x2="344" y2="42" stroke="#2D4152"/>
<rect x="16" y="56" width="328" height="54" rx="5" fill="#1F3142" stroke="#A8A296" stroke-width="1.5"/>
<text x="180" y="79" font-size="12.5" fill="#E8E2D6" text-anchor="middle" font-weight="600">Your machine</text>
<text x="180" y="97" font-size="12" fill="#A8A296" text-anchor="middle">localhost:8000</text>
<path d="M180 112 L180 162" fill="none" stroke="#A8A296" stroke-width="1.5"/><polygon points="175,154 185,154 180,162" fill="#A8A296"/>
<rect x="16" y="166" width="328" height="54" rx="5" fill="#1F3142" stroke="#A8A296" stroke-width="1.5"/>
<text x="180" y="189" font-size="12.5" fill="#E8E2D6" text-anchor="middle" font-weight="600">kubectl port-forward</text>
<text x="180" y="207" font-size="12" fill="#A8A296" text-anchor="middle">service/my-nim-nim-llm 8000:8000</text>
<path d="M180 222 L180 272" fill="none" stroke="#A8A296" stroke-width="1.5"/><polygon points="175,264 185,264 180,272" fill="#A8A296"/>
<rect x="16" y="276" width="328" height="54" rx="5" fill="#1F3142" stroke="#17A1C8" stroke-width="1.5"/>
<text x="180" y="299" font-size="12.5" fill="#E8E2D6" text-anchor="middle" font-weight="600">Kubernetes API server</text>
<text x="180" y="317" font-size="12" fill="#A8A296" text-anchor="middle">authenticates the tunnel</text>
<path d="M180 332 L180 382" fill="none" stroke="#A8A296" stroke-width="1.5"/><polygon points="175,374 185,374 180,382" fill="#A8A296"/>
<rect x="16" y="386" width="328" height="54" rx="5" fill="#1F3142" stroke="#9C7300" stroke-width="1.5"/>
<text x="180" y="409" font-size="12.5" fill="#E8E2D6" text-anchor="middle" font-weight="600">GPU node</text>
<text x="180" y="427" font-size="12" fill="#A8A296" text-anchor="middle">g2-standard-4, one L4</text>
<path d="M180 442 L180 492" fill="none" stroke="#A8A296" stroke-width="1.5"/><polygon points="175,484 185,484 180,492" fill="#A8A296"/>
<rect x="16" y="496" width="328" height="54" rx="5" fill="#1F3142" stroke="#6DA361" stroke-width="1.5"/>
<text x="180" y="519" font-size="12.5" fill="#E8E2D6" text-anchor="middle" font-weight="600">NIM pod</text>
<text x="180" y="537" font-size="12" fill="#A8A296" text-anchor="middle">port 8000</text>
<text x="16" y="576" font-size="12" fill="#A8A296" font-family='"QuoinSans", -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif'>Inside the cluster, the Service (ClusterIP 34.118.X.X, DNS</text>
<text x="16" y="593" font-size="12" fill="#A8A296" font-family='"QuoinSans", -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif'>my-nim-nim-llm.nim.svc.cluster.local) forwards through</text>
<text x="16" y="610" font-size="12" fill="#A8A296" font-family='"QuoinSans", -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif'>kube-proxy iptables rules to the pod IP.</text>
</svg>
